<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <!-- getting the font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montez&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="landing.css">
</head>
<body>
    <header>
        <img src="Pulbic/transparent-image-removebg-preview.png" alt="Logo" class="logo">
        <nav>
            <ul class="nav_list">
                <li><a href="#">Home</a></li>
                <li><a href="#">Kitchen</a></li>
                <li><a href="#">Saved</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="left">
            <section class="primary_section">
                <h1 class="section_heading">Cook with what you have.</h1>
                <p>Gourmet cuisine from your ingredients.</p>
                <div>
                    <input type="search" id="recipe-search" name="savora_search">
                    <button class="search-button">Search</button>
                </div>
            </section>
    
            <section class="secondary_section">
                <h2 class="section_heading">How Savora works.</h2>
                <div>
                    <ul>
                        <li>1.List your ingredients</li>
                        <li>2.Explore the kitchen.</li>
                        <li>3.Save,Cook and Enjoy</li>
                    </ul>
                </div>
            </section>
        </div>
        <div class="right-aside">
                <img src="Pulbic/download.png" alt="Food">
        </div>
    </main>
    <footer>
        <div>Made with love by Ayush and Khusee</div>
    </footer>
</body>
</html>
