<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <!-- getting the font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montez&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="landing.css">
</head>
<body>

    <div class="video-background">
        <video autoplay muted loop id="backVideo">
            <source src="Pulbic/Videos/Restaurant_Ad_Video (online-video-cutter.com).mp4">
            <source src="Pulbic/Videos/fixed.mp4">
        </video>
    </div>

    <header>
        <img src="Pulbic/transparent-image-removebg-preview.png" alt="Logo" class="logo">
        <nav>
            <ul class="nav_list">
                <li><a href="#">Home</a></li>
                <li><a href="#">Kitchen</a></li>
                <li><a href="#">Saved</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>
    </header>
    <main class="main-landing">
        <section class="primary_section" style="grid-area: section-1;">
            <h1 class="section_heading">Cook with what you have.</h1>
            <p>Gourmet cuisine from your ingredients.</p>
            <div>
                <input type="search" id="recipe-search" placeholder="List your ingredients..." name="savora_search">
                <button class="search-button">Search</button>
            </div>
        </section>

        <aside class="right-aside" style="grid-area: aside-img;">
                <img src="Pulbic/download.png" alt="Food">
        </aside>

        <section class="secondary_section" style="grid-area: section-2;">
            <h1 class="section_heading">How Savora works.</h1>
            <div class="info">
                <!-- <ul class="info"> -->
                    <li>1. List your ingredients</li>
                    <li>2. Explore the kitchen.</li>
                    <li>3. Save,Cook and Enjoy</li>
                <!-- </ul> -->
            </div>
        </section>
    </main>
    <footer class="landing-footer">
        Made with love by Ayush and Khushee.
    </footer>
</body>
</html>
